name: Build APK

# Se ejecuta en cada cambio que subas (push) y también con el botón "Run workflow"
on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev

      # Cython reciente: python-for-android arma la app con Python 3.14,
      # que las versiones viejas de Cython (0.29) no soportan
      - name: Instalar Buildozer
        run: pip install --upgrade buildozer cython setuptools

      # Guarda el SDK/NDK y lo ya compilado: las siguientes compilaciones son más rápidas
      - name: Reusar lo descargado en compilaciones anteriores
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      # Firma FIJA: sin esto, cada compilación firma el APK con una clave nueva
      # y Android no deja instalarlo encima de la versión anterior (habría que
      # desinstalar y se perderían los datos). La clave está en el secreto
      # ANDROID_DEBUG_KEYSTORE (copia local en firma/, fuera del repositorio).
      - name: Usar la firma fija del APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Falta el secreto ANDROID_DEBUG_KEYSTORE: el APK sale con una firma nueva"
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Compilar con Buildozer
        run: buildozer -v android debug

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: CalificadorApp-APK
          path: bin/*.apk
